services:
  migrate:
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://beroya:beroya@postgres:5432/beroya_shuttle
      MOCK_REDIS: "false"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["node", "dist/main.js"]
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://beroya:beroya@postgres:5432/beroya_shuttle
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MOCK_REDIS: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MINIO_ENDPOINT: minio
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://beroya:beroya@postgres:5432/beroya_shuttle
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MOCK_REDIS: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MINIO_ENDPOINT: minio
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    environment:
      PGPASSWORD: beroya
    volumes:
      - ./backups:/backups
    command:
      - sh
      - -c
      - pg_dump -h postgres -U beroya -d beroya_shuttle -F c -f /backups/beroya-$$(date +%Y%m%d).dump
    depends_on:
      postgres:
        condition: service_healthy
